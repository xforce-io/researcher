# project.yaml — structured project soul
# Edit this to declare your topic's research questions, criteria, sources.

meta:
  topic_oneline: ""
  language: zh            # output language for all agent prose: zh=简体中文 / en=English

# How runs are delivered. Default (omitted) is local: commit only, no push / no PR —
# works with no git remote. Set mode: remote to push the branch and open a draft PR
# (needs an `origin` remote + authenticated `gh` CLI).
# delivery:
#   mode: local           # local (default) | remote

research_questions:
  - id: RQ1
    text: "Replace this with your first research question."

inclusion_criteria:
  - "Must address one of the research questions above."

exclusion_criteria:
  - "Pure benchmark papers without methodological contribution."

sources:
  - kind: arxiv
    queries:
      - "your topic keyword"
    priority: high

paper_axes: []

cadence:
  default_interval_days: 7
  backoff_after_empty_runs: 3
