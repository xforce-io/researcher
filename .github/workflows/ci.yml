name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.0
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p . --noEmit

      - run: npm run build

      # document-topic-focus / paper-notes-form launch Playwright Chromium.
      # Install here so the full suite is not skipped.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      # topic-setup / onboard commit via git; GHA images have no user.ident.
      - name: Git identity for tests that commit
        run: |
          git config --global user.email "ci@researcher.test"
          git config --global user.name "researcher-ci"

      # library-video asserts Analyze is enabled; UI gates on `which ffmpeg` and
      # `which whisper`. Tests inject a runner and never exec these binaries.
      - name: Stub analyze runtime tools
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/ffmpeg"
          printf '#!/bin/sh\nexit 0\n' > "$HOME/.local/bin/whisper"
          chmod +x "$HOME/.local/bin/ffmpeg" "$HOME/.local/bin/whisper"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm test

      - run: npm run lint
