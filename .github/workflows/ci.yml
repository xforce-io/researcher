name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 23.11.0
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -p . --noEmit

      - run: npm run build

      # document-topic-focus / paper-notes-form launch Playwright Chromium.
      # Install here so the full suite is not skipped.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - run: npm test

      - run: npm run lint
